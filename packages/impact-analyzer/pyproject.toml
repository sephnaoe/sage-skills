[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-impact-analyzer"
version = "1.0.0"
description = "Fast, deterministic change-impact analysis for multi-language codebases"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"

dependencies = [
    "tree-sitter>=0.25.0,<0.27",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.24.0",
]
authors = [{name = "Sage AI Assistant Platform"}]
keywords = ["impact-analysis", "testing", "code-analysis", "python", "javascript", "typescript", "go", "rust"]

[project.urls]
Homepage = "https://github.com/sephnaoe/sage-skills"
Repository = "https://github.com/sephnaoe/sage-skills"

[tool.setuptools.packages.find]
where = ["."]
include = ["impact_analyzer*"]